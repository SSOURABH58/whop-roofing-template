<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="GAF Master Elite Contractor Badge">
  <defs>
    <linearGradient id="gafGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="gafRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE291D" />
      <stop offset="100%" stop-color="#93130C" />
    </linearGradient>
    <linearGradient id="gafNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="112" fill="url(#gafNavy)" stroke="url(#gafGold)" stroke-width="4" filter="url(#shadow)" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Shield Shape -->
  <path d="M120 28 L188 56 V118 C188 166 120 202 120 202 C120 202 52 166 52 118 V56 Z" fill="url(#gafRed)" stroke="url(#gafGold)" stroke-width="3" />
  
  <!-- Red Inner Accent -->
  <path d="M120 38 L178 62 V114 C178 154 120 186 120 186 C120 186 62 154 62 114 V62 Z" fill="#8B110B" opacity="0.6" />

  <!-- GAF Brand Header -->
  <rect x="82" y="70" width="76" height="30" rx="4" fill="#FFFFFF" />
  <text x="120" y="93" fill="#D32F2F" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3" text-anchor="middle">GAF</text>

  <!-- Master Elite Title -->
  <text x="120" y="122" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">MASTER ELITE</text>
  <path d="M84 129 L156 129" stroke="url(#gafGold)" stroke-width="2" />
  <text x="120" y="142" fill="#FCE082" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">ROOFING CONTRACTOR</text>

  <!-- Certification Ribbon Text -->
  <path d="M72 156 Q120 166 168 156" stroke="url(#gafGold)" stroke-width="1" fill="none" />
  <text x="120" y="165" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="1" text-anchor="middle">TOP 2% IN NORTH AMERICA</text>

  <!-- Five Stars -->
  <g fill="url(#gafGold)">
    <polygon points="120,44 122.5,49 128,49.5 124,53 125,58.5 120,55.5 115,58.5 116,53 112,49.5 117.5,49" />
    <polygon points="102,48 104,52 108.5,52.5 105,55.5 106,60 102,57.5 98,60 99,55.5 95.5,52.5 100,52" />
    <polygon points="138,48 140,52 144.5,52.5 141,55.5 142,60 138,57.5 134,60 135,55.5 131.5,52.5 136,52" />
  </g>
</svg>
