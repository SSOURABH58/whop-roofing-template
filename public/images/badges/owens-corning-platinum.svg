<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Owens Corning Platinum Preferred Contractor Badge">
  <defs>
    <linearGradient id="ocPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="ocDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ocPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="ocShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Octagon/Bezel -->
  <polygon points="70,10 170,10 230,70 230,170 170,230 70,230 10,170 10,70" fill="url(#ocDark)" stroke="url(#ocPlatinum)" stroke-width="4" filter="url(#ocShadow)" />
  <polygon points="74,18 166,18 222,74 222,166 166,222 74,222 18,166 18,74" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Owens Corning Header Banner -->
  <rect x="42" y="52" width="156" height="24" rx="3" fill="url(#ocPink)" />
  <text x="120" y="68" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" letter-spacing="1.5" text-anchor="middle">OWENS CORNING®</text>

  <!-- Platinum Emblems -->
  <text x="120" y="112" fill="url(#ocPlatinum)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">PLATINUM</text>
  <text x="120" y="132" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="3" text-anchor="middle">PREFERRED</text>
  <line x1="60" y1="142" x2="180" y2="142" stroke="url(#ocPlatinum)" stroke-width="1.5" />
  
  <text x="120" y="160" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="2" text-anchor="middle">ROOFING CONTRACTOR</text>
  
  <!-- Elite Guarantee Badge -->
  <rect x="68" y="174" width="104" height="20" rx="10" fill="#334155" stroke="url(#ocPlatinum)" stroke-width="1" />
  <text x="120" y="188" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">LIFETIME PRORATION</text>
</svg>
