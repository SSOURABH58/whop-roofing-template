<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="$2M General Liability Insured Badge">
  <defs>
    <linearGradient id="shieldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="insShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Outer Crest -->
  <circle cx="120" cy="120" r="112" fill="url(#shieldGreen)" stroke="url(#goldEdge)" stroke-width="4" filter="url(#insShadow)" />
  <circle cx="120" cy="120" r="102" fill="#064E3B" stroke="#A7F3D0" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Security Padlock / Shield Icon -->
  <path d="M106 68 V54 C106 46 112 40 120 40 C128 40 134 46 134 54 V68" stroke="url(#goldEdge)" stroke-width="4" fill="none" stroke-linecap="round" />
  <rect x="100" y="66" width="40" height="30" rx="6" fill="url(#goldEdge)" />
  <circle cx="120" cy="79" r="4" fill="#064E3B" />
  <path d="M120 83 V88" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Badge Details -->
  <text x="120" y="126" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1" text-anchor="middle">$2M</text>
  <text x="120" y="146" fill="url(#goldEdge)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">INSURED &amp; BONDED</text>
  <line x1="56" y1="154" x2="184" y2="154" stroke="url(#goldEdge)" stroke-width="1.5" />

  <text x="120" y="172" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="1" text-anchor="middle">COMMERCIAL GENERAL LIABILITY</text>
  <text x="120" y="188" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1" text-anchor="middle">FULL WORKERS' COMP COVERAGE</text>
  <text x="120" y="202" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" letter-spacing="1.5" text-anchor="middle">ZERO HOMEOWNER LIABILITY</text>
</svg>
